<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.title{font:700 26px 'Microsoft YaHei',Arial;fill:#0f172a}.head{fill:#ccfbf1;stroke:#0f766e;stroke-width:1.5}.text{font:15px 'Microsoft YaHei',Arial;fill:#0f172a}.small{font:13px 'Microsoft YaHei',Arial;fill:#334155}.life{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:6 6}.arrow{stroke:#0f766e;stroke-width:1.8;marker-end:url(#arrow);fill:none}.note{fill:#f0fdfa;stroke:#99f6e4;stroke-width:1}</style>
  </defs>
  <rect width="1180" height="720" fill="#fff"/>
  <text x="590" y="44" text-anchor="middle" class="title">图3-6 用户与结果管理时序图</text>
  <g transform="translate(45,78)">
    <rect class="head" x="0" y="0" width="145" height="46" rx="6"/><text class="text" x="72.5" y="29" text-anchor="middle">用户页面</text><line class="life" x1="72.5" y1="46" x2="72.5" y2="570"/>
    <rect class="head" x="180" y="0" width="170" height="46" rx="6"/><text class="text" x="265" y="29" text-anchor="middle">Auth API</text><line class="life" x1="265" y1="46" x2="265" y2="570"/>
    <rect class="head" x="385" y="0" width="190" height="46" rx="6"/><text class="text" x="480" y="29" text-anchor="middle">Session / User</text><line class="life" x1="480" y1="46" x2="480" y2="570"/>
    <rect class="head" x="610" y="0" width="170" height="46" rx="6"/><text class="text" x="695" y="29" text-anchor="middle">Saved API</text><line class="life" x1="695" y1="46" x2="695" y2="570"/>
    <rect class="head" x="815" y="0" width="220" height="46" rx="6"/><text class="text" x="925" y="29" text-anchor="middle">用户结果目录</text><line class="life" x1="925" y1="46" x2="925" y2="570"/>
    <line class="arrow" x1="72.5" y1="90" x2="265" y2="90"/><text class="small" x="169" y="78" text-anchor="middle">注册或登录</text>
    <line class="arrow" x1="265" y1="132" x2="480" y2="132"/><text class="small" x="373" y="120" text-anchor="middle">校验用户并写入 session</text>
    <line class="arrow" x1="480" y1="174" x2="265" y2="174"/><text class="small" x="373" y="162" text-anchor="middle">返回当前用户状态</text>
    <line class="arrow" x1="265" y1="216" x2="72.5" y2="216"/><text class="small" x="169" y="204" text-anchor="middle">展示用户中心入口</text>
    <line class="arrow" x1="72.5" y1="274" x2="695" y2="274"/><text class="small" x="384" y="262" text-anchor="middle">保存推荐结果或请求历史列表</text>
    <line class="arrow" x1="695" y1="316" x2="480" y2="316"/><text class="small" x="588" y="304" text-anchor="middle">读取 currentUser</text>
    <line class="arrow" x1="695" y1="358" x2="925" y2="358"/><text class="small" x="810" y="346" text-anchor="middle">按用户目录写入或读取 JSON</text>
    <rect class="note" x="600" y="382" width="390" height="62" rx="5"/><text class="small" x="615" y="406">删除记录时校验所有者</text><text class="small" x="615" y="427">公开 demo 记录仅展示，不允许普通删除</text>
    <line class="arrow" x1="925" y1="468" x2="695" y2="468"/><text class="small" x="810" y="456" text-anchor="middle">返回保存状态、列表或详情</text>
    <line class="arrow" x1="695" y1="510" x2="72.5" y2="510"/><text class="small" x="384" y="498" text-anchor="middle">返回操作结果并刷新页面</text>
  </g>
</svg>