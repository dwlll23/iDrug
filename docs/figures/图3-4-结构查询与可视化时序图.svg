<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <style>.title{font:700 26px 'Microsoft YaHei',Arial;fill:#0f172a}.head{fill:#ccfbf1;stroke:#0f766e;stroke-width:1.5}.text{font:15px 'Microsoft YaHei',Arial;fill:#0f172a}.small{font:13px 'Microsoft YaHei',Arial;fill:#334155}.life{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:6 6}.arrow{stroke:#0f766e;stroke-width:1.8;marker-end:url(#arrow);fill:none}.note{fill:#f0fdfa;stroke:#99f6e4;stroke-width:1}</style>
  </defs>
  <rect width="1180" height="720" fill="#fff"/>
  <text x="590" y="44" text-anchor="middle" class="title">图3-4 结构查询与可视化时序图</text>
  <g transform="translate(45,78)">
    <rect class="head" x="0" y="0" width="145" height="46" rx="6"/><text class="text" x="72.5" y="29" text-anchor="middle">查询页面</text><line class="life" x1="72.5" y1="46" x2="72.5" y2="570"/>
    <rect class="head" x="180" y="0" width="170" height="46" rx="6"/><text class="text" x="265" y="29" text-anchor="middle">查询 API</text><line class="life" x1="265" y1="46" x2="265" y2="570"/>
    <rect class="head" x="385" y="0" width="190" height="46" rx="6"/><text class="text" x="480" y="29" text-anchor="middle">查询服务模块</text><line class="life" x1="480" y1="46" x2="480" y2="570"/>
    <rect class="head" x="610" y="0" width="160" height="46" rx="6"/><text class="text" x="690" y="29" text-anchor="middle">本地缓存</text><line class="life" x1="690" y1="46" x2="690" y2="570"/>
    <rect class="head" x="805" y="0" width="230" height="46" rx="6"/><text class="text" x="920" y="29" text-anchor="middle">外部数据接口</text><line class="life" x1="920" y1="46" x2="920" y2="570"/>
    <line class="arrow" x1="72.5" y1="90" x2="265" y2="90"/><text class="small" x="169" y="78" text-anchor="middle">提交 CID、PDB、UniProt 或序列</text>
    <line class="arrow" x1="265" y1="132" x2="480" y2="132"/><text class="small" x="373" y="120" text-anchor="middle">queryStructure(queryType, queryText)</text>
    <line class="arrow" x1="480" y1="174" x2="690" y2="174"/><text class="small" x="585" y="162" text-anchor="middle">优先检索本地映射和缓存</text>
    <line class="arrow" x1="690" y1="216" x2="480" y2="216"/><text class="small" x="585" y="204" text-anchor="middle">返回命中数据或未命中状态</text>
    <rect class="note" x="542" y="237" width="390" height="62" rx="5"/><text class="small" x="557" y="261">本地未命中时，按查询类型选择 PubChem、PDB、UniProt</text><text class="small" x="557" y="282">接口异常时返回降级信息，保证页面可继续使用</text>
    <line class="arrow" x1="480" y1="327" x2="920" y2="327"/><text class="small" x="700" y="315" text-anchor="middle">调用外部接口补全结构信息</text>
    <line class="arrow" x1="920" y1="369" x2="480" y2="369"/><text class="small" x="700" y="357" text-anchor="middle">返回药物、蛋白或复合物数据</text>
    <line class="arrow" x1="480" y1="411" x2="265" y2="411"/><text class="small" x="373" y="399" text-anchor="middle">统一字段、图片路径和结构标识</text>
    <line class="arrow" x1="265" y1="453" x2="72.5" y2="453"/><text class="small" x="169" y="441" text-anchor="middle">返回 JSON 查询结果</text>
    <line class="arrow" x1="72.5" y1="505" x2="72.5" y2="505"/><text class="small" x="92" y="496">渲染文本信息、结构图片或三维视图</text>
  </g>
</svg>