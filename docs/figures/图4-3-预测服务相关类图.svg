<svg width="1800" height="1050" viewBox="0 0 1800 1050" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748B"/></marker>
    <style>.title{font:700 46px 'Microsoft YaHei',Arial;fill:#1E2B3C}.pkg{fill:#F8FAFC;stroke:#90A4AE;stroke-width:2;rx:22}.cls{fill:#FFFFFF;stroke:#B8C7D9;stroke-width:1.8;rx:12}.head{font:700 30px 'Microsoft YaHei',Arial;fill:#1E2B3C}.txt{font:23px 'Microsoft YaHei',Arial;fill:#334155}.small{font:20px 'Microsoft YaHei',Arial;fill:#5B6B7E}.line{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#arrow)}.dep{stroke:#6E9FD8;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1800" height="1050" fill="#FFFFFF"/>
  <text x="900" y="54" text-anchor="middle" class="title">图4-3 预测服务相关类与模块图</text>
  <rect class="pkg" x="60" y="95" width="1680" height="860" rx="24"/>
  <text x="96" y="142" class="head">多场景 DTI 预测服务</text>
  <rect class="cls" x="110" y="180" width="430" height="235" rx="12"/><text x="325" y="222" text-anchor="middle" class="head">PredictionModelsRunView</text><line x1="110" y1="238" x2="540" y2="238" stroke="#B8C7D9"/><text x="135" y="276" class="txt">+ post(request)</text><text x="135" y="312" class="small">读取 task_type</text><text x="135" y="344" class="small">校验 drug_input / protein_input</text><text x="135" y="376" class="small">返回统一预测响应</text>
  <rect class="cls" x="660" y="180" width="430" height="235" rx="12"/><text x="875" y="222" text-anchor="middle" class="head">prediction_model_services</text><line x1="660" y1="238" x2="1090" y2="238" stroke="#B8C7D9"/><text x="685" y="276" class="txt">+ run_prediction_task()</text><text x="685" y="312" class="small">任务到模型的分发</text><text x="685" y="344" class="small">构造输入文件和命令</text><text x="685" y="376" class="small">解析模型输出</text>
  <rect class="cls" x="1210" y="180" width="430" height="235" rx="12"/><text x="1425" y="222" text-anchor="middle" class="head">DTI</text><line x1="1210" y1="238" x2="1640" y2="238" stroke="#B8C7D9"/><text x="1235" y="276" class="txt">+ post(request)</text><text x="1235" y="312" class="small">构造药物和蛋白列表</text><text x="1235" y="344" class="small">调用 HyperAttentionDTI</text><text x="1235" y="376" class="small">组织 prob_list</text>
  <rect class="cls" x="135" y="535" width="370" height="220" rx="12"/><text x="320" y="577" text-anchor="middle" class="head">HyperAttentionDTI</text><line x1="135" y1="593" x2="505" y2="593" stroke="#B8C7D9"/><text x="160" y="631" class="txt">+ run_hyperattention_task()</text><text x="160" y="667" class="small">human checkpoint</text><text x="160" y="699" class="small">gpcr checkpoint</text>
  <rect class="cls" x="575" y="535" width="310" height="220" rx="12"/><text x="730" y="577" text-anchor="middle" class="head">PSICHIC</text><line x1="575" y1="593" x2="885" y2="593" stroke="#B8C7D9"/><text x="600" y="631" class="txt">+ run_psichic()</text><text x="600" y="667" class="small">新药评价</text><text x="600" y="699" class="small">分类预测结果</text>
  <rect class="cls" x="955" y="535" width="310" height="220" rx="12"/><text x="1110" y="577" text-anchor="middle" class="head">DeepDTA</text><line x1="955" y1="593" x2="1265" y2="593" stroke="#B8C7D9"/><text x="980" y="631" class="txt">+ run_deepdta()</text><text x="980" y="667" class="small">亲和力预测</text><text x="980" y="699" class="small">输出 affinity score</text>
  <rect class="cls" x="1335" y="535" width="330" height="220" rx="12"/><text x="1500" y="577" text-anchor="middle" class="head">RuntimeTempDir</text><line x1="1335" y1="593" x2="1665" y2="593" stroke="#B8C7D9"/><text x="1360" y="631" class="txt">input.csv / pred.csv</text><text x="1360" y="667" class="small">临时目录隔离</text><text x="1360" y="699" class="small">finally 清理</text>
