  <rect class="cls" x="100" y="180" width="330" height="230" rx="12"/><text x="265" y="222" text-anchor="middle" class="head">DrugView</text><line x1="100" y1="238" x2="430" y2="238" stroke="#B8C7D9"/><text x="125" y="276" class="txt">+ post(request)</text><text x="125" y="312" class="small">CID / SMILES 查询</text><text x="125" y="344" class="small">返回药物结构信息</text>
  <rect class="cls" x="500" y="180" width="330" height="230" rx="12"/><text x="665" y="222" text-anchor="middle" class="head">ProteinView</text><line x1="500" y1="238" x2="830" y2="238" stroke="#B8C7D9"/><text x="525" y="276" class="txt">+ post(request)</text><text x="525" y="312" class="small">PDB / UniProt / Sequence</text><text x="525" y="344" class="small">返回蛋白信息</text>
