<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="670" viewBox="0 0 1180 670">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>.title{font:700 26px 'Microsoft YaHei',Arial;fill:#0f172a}.head{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.5}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}.text{font:15px 'Microsoft YaHei',Arial;fill:#0f172a}.small{font:13px 'Microsoft YaHei',Arial;fill:#334155}.life{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:6 6}.arrow{stroke:#2563eb;stroke-width:1.8;marker-end:url(#arrow);fill:none}.return{stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#arrow);fill:none}.note{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1}</style>
  </defs>
  <rect width="1180" height="670" fill="#fff"/>
  <g transform="translate(45,28)">
    <rect class="head" x="0" y="0" width="145" height="46" rx="6"/><text class="text" x="72.5" y="29" text-anchor="middle">预测页面</text><line class="life" x1="72.5" y1="46" x2="72.5" y2="570"/>
    <rect class="head" x="180" y="0" width="170" height="46" rx="6"/><text class="text" x="265" y="29" text-anchor="middle">Prediction API</text><line class="life" x1="265" y1="46" x2="265" y2="570"/>
    <rect class="head" x="385" y="0" width="190" height="46" rx="6"/><text class="text" x="480" y="29" text-anchor="middle">模型调度服务</text><line class="life" x1="480" y1="46" x2="480" y2="570"/>
    <rect class="head" x="610" y="0" width="160" height="46" rx="6"/><text class="text" x="690" y="29" text-anchor="middle">运行临时区</text><line class="life" x1="690" y1="46" x2="690" y2="570"/>
    <rect class="head" x="805" y="0" width="230" height="46" rx="6"/><text class="text" x="920" y="29" text-anchor="middle">模型脚本与权重</text><line class="life" x1="920" y1="46" x2="920" y2="570"/>
    <line class="arrow" x1="72.5" y1="90" x2="265" y2="90"/><text class="small" x="169" y="78" text-anchor="middle">选择任务并提交药物、靶点输入</text>
    <line class="arrow" x1="265" y1="132" x2="480" y2="132"/><text class="small" x="373" y="120" text-anchor="middle">run_prediction_task(task_type)</text>
    <line class="arrow" x1="480" y1="174" x2="480" y2="174"/><text class="small" x="585" y="164">任务—模型匹配</text>
    <rect class="note" x="542" y="183" width="370" height="70" rx="5"/><text class="small" x="557" y="207">药物重定位、新靶标筛选：HyperAttentionDTI</text><text class="small" x="557" y="228">新药评估：PSICHIC</text><text class="small" x="557" y="249">亲和力预测：DeepDTA</text>
    <line class="arrow" x1="480" y1="285" x2="690" y2="285"/><text class="small" x="585" y="273" text-anchor="middle">生成 input.csv、输出路径</text>
    <line class="arrow" x1="690" y1="327" x2="920" y2="327"/><text class="small" x="805" y="315" text-anchor="middle">调用独立 Python 推理脚本</text>
    <line class="arrow" x1="920" y1="369" x2="690" y2="369"/><text class="small" x="805" y="357" text-anchor="middle">写入 pred.csv 或结果文件</text>
    <line class="arrow" x1="690" y1="411" x2="480" y2="411"/><text class="small" x="585" y="399" text-anchor="middle">读取并解析模型输出</text>
    <line class="arrow" x1="480" y1="453" x2="265" y2="453"/><text class="small" x="373" y="441" text-anchor="middle">封装任务状态和结果列表</text>
    <line class="arrow" x1="265" y1="495" x2="72.5" y2="495"/><text class="small" x="169" y="483" text-anchor="middle">返回 JSON</text>
    <line class="arrow" x1="72.5" y1="537" x2="72.5" y2="537"/><text class="small" x="92" y="528">渲染预测分数、标签和排名</text>
  </g>
</svg>
